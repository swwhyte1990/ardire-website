<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Private Tours &amp; Event Management Scotland | The Árdíre Group</title>
    <meta
      name="description"
      content="Private tours, golf tours and chauffeur travel across Scotland, with event management, staffing and corporate incentives. By The Árdíre Group, Glasgow."
    />
    <link rel="canonical" href="https://ardire.co.uk/" />
    <link rel="alternate" hreflang="en-GB" href="https://ardire.co.uk/" />
    <link rel="alternate" hreflang="x-default" href="https://ardire.co.uk/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ardire.co.uk/" />
    <meta
      property="og:title"
      content="Private Tours &amp; Event Management Scotland | The Árdíre Group"
    />
    <meta
      property="og:description"
      content="Private tours, golf tours and chauffeur travel across Scotland, with event management, staffing and corporate incentives. By The Árdíre Group, Glasgow."
    />
    <meta
      property="og:image"
      content="https://ardire.co.uk/opengraph.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The gold Árdíre crest beside a floodlit Scottish castle on a still loch at dusk"
    />
    <meta property="og:site_name" content="The Árdíre Group" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Private Tours &amp; Event Management Scotland | The Árdíre Group"
    />
    <meta
      name="twitter:description"
      content="Private tours, golf tours and chauffeur travel across Scotland, with event management, staffing and corporate incentives. By The Árdíre Group, Glasgow."
    />
    <meta
      name="twitter:image"
      content="https://ardire.co.uk/opengraph.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="The gold Árdíre crest beside a floodlit Scottish castle on a still loch at dusk"
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.web3forms.com https://cloudflareinsights.com; font-src 'self';" />


    <!-- Critical inline styles: prevents flash before async CSS arrives -->
    <style>*,::after,::before{box-sizing:border-box}html{line-height:1.5;-webkit-text-size-adjust:100%}body{margin:0;background:#071a0e;color:#c5a366;font-family:Georgia,serif}#root{min-height:100vh}</style>

    <!-- Mobile browser chrome colour matches brand dark green -->
    <meta name="theme-color" content="#071a0e" />
    <!-- Preload above-fold images -->
    <link rel="preload" as="image" href="/images/hero-home.webp" />

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "The Árdíre Group",
        "alternateName": ["Árdíre", "Ardire", "The Ardire Group"],
        "description": "Luxury touring, golf tours, corporate incentives, event management and event staffing based in Glasgow.",
        "url": "https://ardire.co.uk/",
        "logo": "https://ardire.co.uk/images/logo-crest.webp",
        "image": "https://ardire.co.uk/opengraph.jpg",
        "telephone": "+441412550796",
        "email": "enquiries@ardire.co.uk",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Glasgow",
          "addressCountry": "GB"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Scotland"
        },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Luxury Scottish Experiences",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Luxury Tours" }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Corporate Incentives"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Self-Guided Tours" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Event Staffing" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Event Management" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Golf Tours" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "Private Chauffeur" }
            }
          ]
        },
        "sameAs": [
          "https://www.instagram.com/ardiregroupsocial",
          "https://www.tiktok.com/@ardiregroup"
        ]
      }
    </script>
  </head>
  <body style="background:#071a0e">
    <!-- The homepage's raw HTML (heading, hero line, cards, About, enquiry details) is
         written into this block at build time by scripts/generate-routes.mjs, from
         src/data/homePage.json, the same file the React page reads. -->
    <div id="root"><div data-page-content></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
